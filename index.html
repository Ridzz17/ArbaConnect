    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e1) {
          try {
            if (window.Window && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                }
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
